version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: temaqui_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temaqui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temaqui_secret}
      POSTGRES_DB: ${POSTGRES_DB:-temaqui_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - temaqui-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temaqui} -d ${POSTGRES_DB:-temaqui_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: temaqui_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-temaqui}:${POSTGRES_PASSWORD:-temaqui_secret}@db:5432/${POSTGRES_DB:-temaqui_db}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - temaqui-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: temaqui_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - temaqui-network

volumes:
  postgres_data:

networks:
  temaqui-network:
    driver: bridge
